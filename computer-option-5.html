<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option 5 — Command center</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { navy:'#0E1B2C', ink:'#38506B', heroslate:'#38506B', ice:'#E9F1FA', cta:'#2F7BFF', ctahover:'#1F63DA', mist:'#F4F7FB', thread:'#F7FAFD' } } } };
</script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-thread min-h-screen p-6 font-sans">
<div class="mx-auto max-w-[420px]">
  <p class="mb-2 text-xs font-bold uppercase tracking-widest text-slate-400">Option 5 — Dark command center</p>

  <div class="rounded-2xl bg-navy p-5 text-white shadow-sm">
    <div class="flex items-center justify-between">
      <p class="font-mono text-xs text-white/50">wayfind ~ computer</p>
      <span class="inline-flex items-center gap-1.5 font-mono text-xs text-emerald-400">
        <span class="h-1.5 w-1.5 animate-pulse rounded-full bg-emerald-400"></span>online
      </span>
    </div>
    <p class="mt-2 font-mono text-xs leading-relaxed text-white/70">
      <span class="text-white/40">$</span> whoami<br />
      <span class="text-white">bash · alpine · 110×25</span>
    </p>
    <button class="mt-3 flex w-full items-center justify-center gap-2 rounded-xl bg-white/10 py-2.5 text-sm font-bold text-white ring-1 ring-white/15 hover:bg-white/15">
      <i data-lucide="terminal" class="h-4 w-4"></i>Open terminal
    </button>

    <div class="my-4 h-px bg-white/10"></div>

    <p class="font-mono text-xs text-white/50"><span class="text-white/40">$</span> preview --port</p>
    <div class="mt-2 flex gap-2">
      <input value="5173" class="w-full min-w-0 flex-1 rounded-xl bg-white/10 px-3 py-2.5 font-mono text-sm text-white outline-none ring-1 ring-white/15 focus:ring-cta" aria-label="Dev server port" />
      <button class="inline-flex shrink-0 items-center gap-1.5 rounded-xl bg-cta px-4 py-2 text-sm font-bold text-white hover:bg-ctahover">
        <i data-lucide="zap" class="h-4 w-4"></i>Go
      </button>
    </div>
    <button class="mt-2.5 flex w-full items-center justify-center gap-1.5 text-xs font-semibold text-white/50 hover:text-white">
      <i data-lucide="copy" class="h-3.5 w-3.5"></i>copy signed link (15 min)
    </button>
  </div>

  <p class="mt-3 text-xs text-slate-500">Why: leans into the developer audience — the whole tab feels like the machine it controls. Highest personality, least "friendly SaaS".</p>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
