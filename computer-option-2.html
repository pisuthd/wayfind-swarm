<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Option 2 — Preview hero</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = { theme: { extend: { colors: { navy:'#0E1B2C', ink:'#38506B', heroslate:'#38506B', ice:'#E9F1FA', cta:'#2F7BFF', ctahover:'#1F63DA', mist:'#F4F7FB', thread:'#F7FAFD' } } } };
</script>
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-thread min-h-screen p-6 font-sans">
<div class="mx-auto max-w-[420px]">
  <p class="mb-2 text-xs font-bold uppercase tracking-widest text-slate-400">Option 2 — Preview is the hero</p>

  <div class="overflow-hidden rounded-2xl bg-navy p-5 text-white shadow-sm">
    <div class="flex items-center gap-2 text-xs font-semibold text-white/60">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-400"></span>Computer online · bash · Alpine
    </div>
    <p class="mt-3 font-display text-xl font-bold leading-snug">See what your bot built.</p>
    <div class="mt-3 flex gap-2">
      <div class="flex min-w-0 flex-1 items-center gap-2 rounded-xl bg-white/10 px-3 py-2.5 ring-1 ring-white/15 focus-within:ring-cta">
        <span class="text-xs font-bold text-white/50">:</span>
        <input value="5173" class="w-full bg-transparent text-sm font-semibold text-white outline-none placeholder:text-white/40" placeholder="5173" aria-label="Dev server port" />
      </div>
      <button class="inline-flex shrink-0 items-center gap-1.5 rounded-xl bg-cta px-5 py-2.5 text-sm font-bold text-white hover:bg-ctahover">
        <i data-lucide="play" class="h-4 w-4"></i>Preview
      </button>
    </div>
    <p class="mt-2.5 text-xs text-white/55">Ask the bot to start the dev server, then hit Preview.</p>
  </div>

  <button class="mt-2.5 flex w-full items-center gap-3 rounded-2xl bg-white p-4 text-left shadow-sm hover:bg-mist">
    <div class="grid h-9 w-9 shrink-0 place-items-center rounded-xl bg-ice text-navy">
      <i data-lucide="terminal" class="h-4 w-4"></i>
    </div>
    <div class="min-w-0 flex-1">
      <p class="text-sm font-bold text-navy">Open terminal</p>
      <p class="truncate text-xs text-heroslate">A live shell on the same computer</p>
    </div>
    <i data-lucide="chevron-right" class="h-4 w-4 shrink-0 text-slate-300"></i>
  </button>

  <p class="mt-3 text-xs text-slate-500">Why: preview is the thing users want 90% of the time — give it the big navy moment, demote terminal to a quiet row.</p>
</div>
<script>lucide.createIcons();</script>
</body>
</html>
